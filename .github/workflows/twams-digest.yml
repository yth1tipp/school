name: Teams daily digest


on:

  schedule:

    # 09:30 UTC = 18:30 KST, 매일 (Power Automate 18:00 실행이 끝난 뒤)

    - cron: "30 9 * * *"

  workflow_dispatch:


permissions:

  issues: write


jobs:

  digest:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4


      - uses: actions/setup-python@v5

        with:

          python-version: "3.12"


      - name: Install deps

        run: pip install requests


      - name: Build digest

        env:

          DIGEST_URL: ${{ secrets.DIGEST_URL }}

          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          GH_REPO: ${{ github.repository }}

        run: python scripts/digest.py



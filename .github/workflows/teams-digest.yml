name: Teams daily digest

# 자동 실행 없이, Actions 화면의 Run workflow 버튼을 누를 때만 실행
on:
  workflow_dispatch:

# 버튼을 연달아 눌러도 한 번에 하나씩만 실행 (중복 요약 방지)
concurrency:
  group: teams-digest
  cancel-in-progress: false

permissions:
  issues: write
  models: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Build digest
        env:
          DIGEST_URL: ${{ secrets.DIGEST_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/digest.py
